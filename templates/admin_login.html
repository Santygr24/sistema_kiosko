<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ negocio }} - Ingreso al panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login">

  <div class="login-caja">
    <div class="rayas rayas-chicas" aria-hidden="true"></div>
    <form method="post" class="login-form">
      <h1>Kiosko Pelon</h1>
      <p class="sub">Ingresá la contraseña para ver los pedidos.</p>

      {% if error %}
        <p class="mensaje error" role="alert">{{ error }}</p>
      {% endif %}

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autofocus>

      <button class="btn btn-primario btn-ancho" type="submit">Entrar al panel</button>
      <a class="btn-texto" href="{{ url_for('tienda') }}">Volver a la tienda</a>
    </form>
  </div>

</body>
</html>
